[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Reuse the existing Wi-Fi secrets from Firmware/Master/include/secrets.h.
; The path is relative to Firmware/Display.
build_flags =
    -I ../Master/include
upload_protocol = espota
upload_port = 192.168.1.112
;upload_flags =
;    --port=3232
;    --host_port=3232

lib_deps =
    adafruit/Adafruit SHT31 Library

;build_flags =
;    -DCORE_DEBUG_LEVEL=0
