[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

upload_protocol = espota
upload_port = 192.168.1.111

; Reuse the existing Wi-Fi secrets from Firmware/Master/include/secrets.h.
; The path is relative to Firmware/Display.
build_flags =
    -I ../Master/include

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    paulstoffregen/XPT2046_Touchscreen
    adafruit/Adafruit SHT31 Library
    adafruit/RTClib
    bblanchon/ArduinoJson
